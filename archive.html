<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  try {
    var t = localStorage.getItem("pp.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive - Puzzle Press</title>
<meta name="description" content="Play any past day's Puzzle Press puzzles, game by game.">
<link rel="canonical" href="https://munzzyy.github.io/puzzlepress/archive.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Puzzle Press">
<meta property="og:title" content="Archive - Puzzle Press">
<meta property="og:description" content="Play any past day's Puzzle Press puzzles, game by game.">
<meta property="og:url" content="https://munzzyy.github.io/puzzlepress/archive.html">
<meta property="og:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/hub.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Archive - Puzzle Press">
<meta name="twitter:description" content="Play any past day's Puzzle Press puzzles, game by game.">
<meta name="twitter:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/hub.png">
<meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.png" type="image/png">
<link rel="icon" href="assets/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="pp-skip-link" href="#main">Skip to archive</a>

<div class="pp-wrap">
  <header class="pp-masthead">
    <div class="pp-masthead__top">
      <div>
        <a class="pp-wordmark" href="index.html">Puzzle Press</a>
        <div class="pp-masthead__rule">Archive</div>
      </div>
      <button type="button" class="pp-theme-toggle" id="theme-toggle" aria-label="Switch to dark theme"></button>
    </div>
    <p class="pp-dateline" id="archive-note"></p>
  </header>

  <main id="main">
    <section id="archive-list" aria-label="Past days, by game"></section>
  </main>

  <footer class="pp-footer">
    <p>Free to play, source on GitHub, no accounts, no ads, no tracking.</p>
    <a href="https://github.com/munzzyy/puzzlepress">View source on GitHub</a>
  </footer>
</div>

<script type="module">
import { dayIndex, dateKeyForIndex, store, lastDiff } from "./assets/shared.js";

// Every game's EPOCH constant is "2026-08-10"; keep this in sync with them.
const EPOCH = "2026-08-10";
const THEME_KEY = "pp.theme";

const GAMES = [
  { id: "wordrow", name: "Wordrow" },
  { id: "clusters", name: "Clusters" },
  { id: "heptagram", name: "Heptagram" },
  { id: "minigrid", name: "Minigrid" },
  { id: "wordweave", name: "Wordweave" },
  { id: "edgeways", name: "Edgeways" },
  { id: "sudoku", name: "Sudoku", defaultDiff: "easy" },
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function shortLabel(dateKey) {
  const [y, m, d] = dateKey.split("-").map(Number);
  return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(new Date(y, m - 1, d));
}

function renderArchive() {
  const todayIdx = dayIndex(EPOCH);
  const list = document.getElementById("archive-list");
  const note = document.getElementById("archive-note");

  if (todayIdx <= 0) {
    note.textContent = "";
    list.innerHTML =
      `<p class="ar-empty">The archive starts filling in tomorrow. Today's puzzles are on ` +
      `<a href="index.html">the hub</a>.</p>`;
    return;
  }

  note.textContent = `${todayIdx} past day${todayIdx === 1 ? "" : "s"} to replay, back to launch. ` +
    "Playing an old day never touches today's puzzle or your streak.";

  list.innerHTML = GAMES.map((g) => {
    const diff = lastDiff(g.id, g.defaultDiff || "medium");
    const s = store(g.id, diff);
    const chips = [];
    for (let idx = todayIdx - 1; idx >= 0; idx--) {
      const dateKey = dateKeyForIndex(EPOCH, idx);
      const played = s.loadDay(dateKey) != null;
      chips.push(
        `<a class="ar-chip" data-played="${played}" href="games/${g.id}/index.html?date=${dateKey}">` +
        `${esc(shortLabel(dateKey))}</a>`
      );
    }
    return (
      `<div class="ar-section" data-game="${g.id}">` +
      `<h2 class="ar-section__title">` +
      `<span class="pp-card__icon"><span class="pp-card__glyph" aria-hidden="true"></span></span>` +
      `${esc(g.name)}</h2>` +
      `<div class="ar-chips">${chips.join("")}</div>` +
      `</div>`
    );
  }).join("");
}

function currentTheme() {
  const stored = localStorage.getItem(THEME_KEY);
  if (stored === "light" || stored === "dark") return stored;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
    ? "dark"
    : "light";
}

function wireThemeToggle() {
  const btn = document.getElementById("theme-toggle");
  const iconFor = (theme) =>
    theme === "dark"
      ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  const apply = (theme) => {
    document.documentElement.setAttribute("data-theme", theme);
    btn.innerHTML = iconFor(theme);
    btn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
  };

  apply(currentTheme());
  btn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    try {
      localStorage.setItem(THEME_KEY, next);
    } catch (e) {}
    apply(next);
  });
}

renderArchive();
wireThemeToggle();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
