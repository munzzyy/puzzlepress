<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  try {
    var t = localStorage.getItem("pp.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordweave - Puzzle Press</title>
<meta name="description" content="Every letter belongs. Find the theme words woven through a 6x8 grid and uncover the spanning word that ties them together.">
<link rel="canonical" href="https://munzzyy.github.io/puzzlepress/games/wordweave/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Puzzle Press">
<meta property="og:title" content="Wordweave - Puzzle Press">
<meta property="og:description" content="Every letter belongs. Find the theme words woven through a 6x8 grid and uncover the spanning word that ties them together.">
<meta property="og:url" content="https://munzzyy.github.io/puzzlepress/games/wordweave/">
<meta property="og:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/wordweave.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Wordweave - Puzzle Press">
<meta name="twitter:description" content="Every letter belongs. Find the theme words woven through a 6x8 grid and uncover the spanning word that ties them together.">
<meta name="twitter:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/wordweave.png">
<meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon.png" type="image/png">
<link rel="icon" href="../../assets/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/icons/icon-180.png">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="style.css">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Game", "name": "Wordweave", "url": "https://munzzyy.github.io/puzzlepress/games/wordweave/", "description": "Find the theme words hidden in a grid of letters, then the one that spans it.", "genre": "Puzzle", "isAccessibleForFree": true}</script>
</head>
<body>
<a class="pp-skip-link" href="#main">Skip to puzzle</a>
<div id="pp-chrome"></div>

<main id="main" class="pp-game" data-game="wordweave">
  <div class="pp-diff-row">
    <div class="pp-difftabs" id="ww-difftabs"></div>
    <div class="pp-status-row">
      <span id="ww-progress">0 / 0 words</span>
      <span id="ww-timer">0:00</span>
    </div>
  </div>

  <p class="ww-banner" id="ww-theme-banner" aria-live="polite">Find the spanning word to reveal today's theme.</p>

  <div class="ww-board-wrap">
    <div class="ww-grid" id="ww-grid" role="group" aria-label="Letter grid, use arrow keys to move and space to select"></div>
  </div>

  <div class="ww-current" id="ww-current" aria-live="polite"></div>

  <div class="ww-hint-row">
    <div class="ww-hint-meter" id="ww-hint-meter" aria-hidden="true">
      <span class="ww-hint-dot"></span><span class="ww-hint-dot"></span><span class="ww-hint-dot"></span>
    </div>
    <p class="ww-hint-label" id="ww-hint-label">Find non-theme words to earn a hint</p>
    <button type="button" class="pp-btn" id="ww-hint-btn" disabled>Use hint</button>
  </div>

  <section class="ww-found" aria-label="Words found">
    <ul class="ww-found__list" id="ww-found-list"></ul>
  </section>

  <div class="ww-practice" id="ww-practice" hidden>
    <p>Today's puzzle is solved. Keep going with a puzzle that won't touch your streak.</p>
    <button type="button" class="pp-btn" id="ww-practice-btn">Play a random puzzle</button>
  </div>

  <div class="ww-complete" id="ww-complete" hidden>
    <h2 id="ww-complete-title">Solved</h2>
    <p id="ww-complete-summary"></p>
    <button type="button" class="pp-btn pp-btn--primary" id="ww-share-btn">Share result</button>
  </div>
</main>

<script type="module" src="game.js"></script>
</body>
</html>
