<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  try {
    var t = localStorage.getItem("pp.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clusters - Puzzle Press</title>
<meta name="description" content="Four groups of four. Sort sixteen tiles into their hidden categories before you run out of mistakes.">
<link rel="canonical" href="https://munzzyy.github.io/puzzlepress/games/clusters/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Puzzle Press">
<meta property="og:title" content="Clusters - Puzzle Press">
<meta property="og:description" content="Four groups of four. Sort sixteen tiles into their hidden categories before you run out of mistakes.">
<meta property="og:url" content="https://munzzyy.github.io/puzzlepress/games/clusters/">
<meta property="og:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/clusters.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Clusters - Puzzle Press">
<meta name="twitter:description" content="Four groups of four. Sort sixteen tiles into their hidden categories before you run out of mistakes.">
<meta name="twitter:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/clusters.png">
<meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon.png" type="image/png">
<link rel="icon" href="../../assets/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/icons/icon-180.png">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="style.css">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Game", "name": "Clusters", "url": "https://munzzyy.github.io/puzzlepress/games/clusters/", "description": "Sort sixteen tiles into four themed groups before your fourth mistake.", "genre": "Puzzle", "isAccessibleForFree": true}</script>
</head>
<body>
<a class="pp-skip-link" href="#main">Skip to game</a>
<div id="pp-chrome"></div>

<main id="main" class="pp-game" data-game="clusters">
  <div class="pp-diff-row">
    <div class="pp-difftabs" id="cl-difftabs"></div>
    <div class="pp-status-row" id="cl-status" aria-label="Mistakes remaining"></div>
  </div>

  <p class="cl-intro">Select four tiles that share a connection, then submit. Four wrong guesses and the round ends.</p>

  <p class="cl-banner" id="cl-banner" role="status" aria-live="polite"></p>

  <ol class="cl-solved" id="cl-solved" aria-label="Solved groups"></ol>

  <div class="cl-grid" id="cl-grid" role="group" aria-label="Puzzle tiles"></div>

  <div class="cl-controls">
    <button type="button" class="pp-btn" id="cl-deselect">Deselect</button>
    <button type="button" class="pp-btn" id="cl-shuffle">Shuffle</button>
    <button type="button" class="pp-btn pp-btn--primary" id="cl-submit" disabled>Submit</button>
  </div>

  <div class="cl-endgame" id="cl-endgame" role="status" aria-live="polite" hidden>
    <p class="cl-endgame__text" id="cl-endgame-text"></p>
    <div class="cl-endgame__actions">
      <button type="button" class="pp-btn pp-btn--primary" id="cl-share">Share result</button>
      <button type="button" class="pp-btn" id="cl-random">Play a random puzzle</button>
    </div>
  </div>
</main>

<script type="module" src="game.js"></script>
</body>
</html>
