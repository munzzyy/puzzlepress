<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  try {
    var t = localStorage.getItem("pp.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordrow - Puzzle Press</title>
<meta name="description" content="Six tries. Five letters. A daily word-guessing puzzle from Puzzle Press.">
<meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../../assets/icons/icon-180.png">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="pp-skip-link" href="#main">Skip to game</a>

<main id="main" class="pp-game" data-game="wordrow">
  <p class="wr-status" id="wr-status" aria-live="polite"></p>

  <div class="wr-board" id="wr-board" role="group" aria-label="Guess grid"></div>

  <div class="wr-toolbar">
    <button type="button" class="pp-chip wr-hardmode" id="wr-hardmode" aria-pressed="false">
      <span class="pp-chip__dot" aria-hidden="true"></span>Hard mode
    </button>
    <button type="button" class="pp-btn pp-btn--ghost wr-random" id="wr-random" hidden>Random puzzle</button>
  </div>

  <div class="wr-keyboard" id="wr-keyboard" role="group" aria-label="Keyboard"></div>

  <section class="wr-result" id="wr-result" hidden>
    <p class="wr-result__headline" id="wr-result-headline"></p>
    <p class="wr-result__sub" id="wr-result-sub"></p>
    <div class="pp-stats" id="wr-result-stats"></div>
    <button type="button" class="pp-btn pp-btn--primary wr-share" id="wr-share">Share result</button>
  </section>
</main>

<script type="module" src="game.js"></script>
</body>
</html>
