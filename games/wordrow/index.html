<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  try {
    var t = localStorage.getItem("pp.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordrow - Puzzle Press</title>
<meta name="description" content="A daily word-guessing puzzle in easy, medium, and hard from Puzzle Press.">
<link rel="canonical" href="https://munzzyy.github.io/puzzlepress/games/wordrow/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Puzzle Press">
<meta property="og:title" content="Wordrow - Puzzle Press">
<meta property="og:description" content="A daily word-guessing puzzle in easy, medium, and hard from Puzzle Press.">
<meta property="og:url" content="https://munzzyy.github.io/puzzlepress/games/wordrow/">
<meta property="og:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/wordrow.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Wordrow - Puzzle Press">
<meta name="twitter:description" content="A daily word-guessing puzzle in easy, medium, and hard from Puzzle Press.">
<meta name="twitter:image" content="https://munzzyy.github.io/puzzlepress/assets/cards/wordrow.png">
<meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../../assets/icons/icon-180.png">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="style.css">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Game", "name": "Wordrow", "url": "https://munzzyy.github.io/puzzlepress/games/wordrow/", "description": "Six tries at a five letter word, with a hard mode if you want it.", "genre": "Puzzle", "isAccessibleForFree": true}</script>
</head>
<body>
<a class="pp-skip-link" href="#main">Skip to game</a>
<div id="pp-chrome"></div>

<main id="main" class="pp-game" data-game="wordrow">
  <div class="pp-diff-row">
    <div id="wr-diff-tabs"></div>
    <div class="pp-status-row">
      <span id="wr-status" aria-live="polite"></span>
    </div>
  </div>

  <div class="wr-board" id="wr-board" role="group" aria-label="Guess grid"></div>

  <div class="wr-toolbar">
    <button type="button" class="pp-chip wr-hardmode" id="wr-hardmode" aria-pressed="false">
      <span class="pp-chip__dot" aria-hidden="true"></span>Hard mode
    </button>
    <button type="button" class="pp-chip wr-contrast" id="wr-contrast" aria-pressed="false">
      <span class="pp-chip__dot" aria-hidden="true"></span>High contrast
    </button>
    <button type="button" class="pp-btn pp-btn--ghost wr-random" id="wr-random" hidden>Random puzzle</button>
  </div>

  <div class="wr-keyboard" id="wr-keyboard" role="group" aria-label="Keyboard"></div>

  <section class="wr-result" id="wr-result" role="status" aria-live="polite" hidden>
    <p class="wr-result__headline" id="wr-result-headline"></p>
    <p class="wr-result__sub" id="wr-result-sub"></p>
    <div class="pp-stats" id="wr-result-stats"></div>
    <button type="button" class="pp-btn pp-btn--primary wr-share" id="wr-share">Share result</button>
  </section>
</main>

<script type="module" src="game.js"></script>
</body>
</html>
