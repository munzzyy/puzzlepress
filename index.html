    var t = localStorage.getItem("pp.theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}

<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Puzzle Press", "url": "https://puzzlepress.munzzyy.dev/", "description": "Seven free daily puzzles: a word guess, a grouping game, a pangram hunt, a mini crossword, a word search, a letter-jump game, and sudoku. No accounts, no ads.", "applicationCategory": "GameApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}}</script>

<body>
<a class="pp-skip-link" href="#main">Skip to games</a>

<div class="pp-wrap">
  <header class="pp-masthead">
    <div class="pp-masthead__top">
      <div>
        <a class="pp-wordmark" href="index.html">Puzzle Press</a>
        <div class="pp-masthead__rule">Daily games</div>
      </div>
      <button type="button" class="pp-theme-toggle" id="theme-toggle" aria-label="Switch to dark theme"></button>
    </div>
    <p class="pp-dateline" id="dateline"></p>
    <p class="pp-progress" id="progress-line"></p>
    <p class="pp-combined-stats" id="combined-stats"></p>
    <div class="pp-masthead__links">
      <a class="pp-archive-link" href="archive.html">Play a past day</a>
      <button type="button" class="pp-archive-link pp-share-today" id="share-today" hidden>Share today's results</button>
    </div>
  </header>

  <main id="main">
    <section class="pp-grid" aria-label="Today's games" id="game-grid"></section>
  </main>

  <footer class="pp-footer">
    <p>Free to play, source on GitHub, no accounts, no ads, no tracking.</p>
    <span class="pp-footer__links">
      <a href="https://github.com/munzzyy/puzzlepress" target="_blank" rel="noopener">View source on GitHub</a>
      <a href="https://github.com/munzzyy" target="_blank" rel="noopener">Made by Munzzyy</a>
    </span>
  </footer>
</div>

<script type="module">
import { store, todayKey, lastDiff, getShareLine, share, dayIndex, currentStreak } from "./assets/shared.js";

const SITE_URL = "https://puzzlepress.munzzyy.dev/";
const HUB_EPOCH = "2026-08-10";

const GAMES = [
  { id: "wordrow", name: "Wordrow", tagline: "Six tries. Five letters." },
  { id: "clusters", name: "Clusters", tagline: "Four groups of four." },
  { id: "heptagram", name: "Heptagram", tagline: "Seven letters. One must appear." },
  { id: "minigrid", name: "Minigrid", tagline: "A little crossword." },
  { id: "wordweave", name: "Wordweave", tagline: "Every letter belongs." },
  { id: "edgeways", name: "Edgeways", tagline: "Twelve letters around a square." },
  { id: "sudoku", name: "Sudoku", tagline: "The classic.", defaultDiff: "easy" },
];

const THEME_KEY = "pp.theme";

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/**
 * Four hub chip states, read from the player's last-used difficulty for
 * this game: New (never played it), Continue (a saved day in progress),
 * Solved (today's puzzle already won), Hard-luck (today's puzzle already
 * lost). "Played today" for the progress line is solved-or-lost.
 */
function chipFor(game) {
  const diff = lastDiff(game.id, game.defaultDiff || "medium");
  const s = store(game.id, diff);
  const meta = s.loadMeta();
  const today = todayKey();

  if (meta.last === today) {
    return meta.lastWon
      ? { text: "Solved", state: "solved" }
      : { text: "Hard luck", state: "lost" };
  }
  if (s.loadDay()) return { text: "Continue", state: "continue" };
  return { text: "New", state: "" };
}

function renderGrid() {
  const grid = document.getElementById("game-grid");
  const chips = GAMES.map(chipFor);
  const playedToday = chips.filter((c) => c.state === "solved" || c.state === "lost").length;

  grid.innerHTML = GAMES.map((g, i) => {
    const chip = chips[i];
    const wide = i === GAMES.length - 1;
    const cardClass = wide ? "pp-card pp-card--wide" : "pp-card";
    const chipHTML =
      `<span class="pp-chip" data-state="${chip.state}">` +
      `<span class="pp-chip__dot" aria-hidden="true"></span>${esc(chip.text)}</span>`;
    const iconHTML = `<span class="pp-card__icon"><span class="pp-card__glyph" aria-hidden="true"></span></span>`;
    const nameHTML = `<span class="pp-card__name">${esc(g.name)}</span>`;
    const taglineHTML = `<span class="pp-card__tagline">${esc(g.tagline)}</span>`;

    if (wide) {
      return (
        `<a class="${cardClass}" data-game="${g.id}" href="games/${g.id}/index.html">` +
        iconHTML +
        `<span class="pp-card__wide-text">${nameHTML}${taglineHTML}</span>` +
        chipHTML +
        `</a>`
      );
    }
    return (
      `<a class="${cardClass}" data-game="${g.id}" href="games/${g.id}/index.html">` +
      `<span class="pp-card__top">${iconHTML}${chipHTML}</span>` +
      nameHTML +
      taglineHTML +
      `</a>`
    );
  }).join("");

  document.getElementById("progress-line").innerHTML =
    `<span class="pp-progress__count">${playedToday}</span> of ${GAMES.length} played today`;
}

/**
 * Combined streak across all seven games, read from each game's last-used
 * difficulty (same source chipFor uses). A quiet way to see the whole
 * portfolio's momentum at a glance instead of clicking into each game.
 */
function renderCombinedStats() {
  let streak = 0;
  let best = 0;
  for (const g of GAMES) {
    const diff = lastDiff(g.id, g.defaultDiff || "medium");
    const meta = store(g.id, diff).loadMeta();
    streak += currentStreak(meta);
    best += meta.maxStreak;
  }
  document.getElementById("combined-stats").textContent =
    `Combined streak: ${streak} day${streak === 1 ? "" : "s"}, best combined: ${best}`;
}

function renderShareToday() {
  const btn = document.getElementById("share-today");
  const today = todayKey();
  const lines = GAMES.map((g) => {
    const line = getShareLine(g.id, today);
    return line ? `${g.name}: ${line}` : null;
  }).filter(Boolean);

  btn.hidden = lines.length === 0;
  if (lines.length === 0) return;

  btn.onclick = () => {
    const dayNumber = dayIndex(HUB_EPOCH) + 1;
    const text = [`Puzzle Press #${dayNumber}`, ...lines, SITE_URL].join("\n");
    share(text);
  };
}

function renderDateline() {
  const now = new Date();
  document.getElementById("dateline").textContent = new Intl.DateTimeFormat("en-US", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric",
  }).format(now);
}

function currentTheme() {
  let stored = null;
  try {
    stored = localStorage.getItem(THEME_KEY);
  } catch (e) {}
  if (stored === "light" || stored === "dark") return stored;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
    ? "dark"
    : "light";
}

function wireThemeToggle() {
  const btn = document.getElementById("theme-toggle");
  const iconFor = (theme) =>
    theme === "dark"
      ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  const notifyNative = (theme) => {
    if (window.NativeApp && typeof window.NativeApp.postMessage === "function") {
      try {
        window.NativeApp.postMessage(JSON.stringify({ type: "theme", theme }));
      } catch (e) {}
    }
  };

  const apply = (theme) => {
    document.documentElement.setAttribute("data-theme", theme);
    btn.innerHTML = iconFor(theme);
    btn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
    notifyNative(theme);
  };

  apply(currentTheme());

  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
      let stored = null;
      try {
        stored = localStorage.getItem(THEME_KEY);
      } catch (err) {}
      if (stored) return;
      apply(e.matches ? "dark" : "light");
    });
  }

  btn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    try {
      localStorage.setItem(THEME_KEY, next);
    } catch (e) {}
    apply(next);
  });
}

function renderDay() {
  renderGrid();
  renderCombinedStats();
  renderDateline();
  renderShareToday();
}

renderDay();
wireThemeToggle();

// The Android app and back-forward cache resume this page without reloading it, possibly on a later day.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") renderDay();
});
window.addEventListener("pageshow", (e) => {
  if (e.persisted) renderDay();
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
