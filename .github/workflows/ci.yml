name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: node tests
        run: node --test assets/shared.test.mjs games/wordrow/core.test.mjs games/clusters/core.test.mjs games/heptagram/core.test.mjs games/minigrid/core.test.mjs games/wordweave/core.test.mjs games/edgeways/core.test.mjs games/sudoku/core.test.mjs
      - name: python tests
        run: python -m pip install pytest && python -m pytest -q
